name: CI

# This app is built and deployed by githubonlyy/kids-quests now, which pushes
# the built site to this repo's gh-pages branch. Pages here serves that branch,
# so an Actions deploy from this workflow would fail: deploy-pages only works
# when Pages is configured for Actions. The source under app/ is kept for
# reference until step 5 of the migration removes it, and this workflow now
# only checks that it still builds.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        run: npm ci

      - name: Audit (high+)
        run: npm audit --audit-level=high
        continue-on-error: true

      # a JSX identifier that is imported nowhere builds and tests fine, then
      # white-screens the app; .oxlintrc.json makes that an error
      - name: Lint
        run: npx oxlint src --max-warnings 200

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
